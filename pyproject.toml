[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-common"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "nltk>=3.8",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ipykernel>=6.0", "pandas>=2.0", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["rag_common"]

[tool.uv]
constraint-dependencies = [
  "torch<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sentence-transformers<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "scikit-learn<1.6 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
